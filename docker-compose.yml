services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: crew_management
      POSTGRES_USER: crew
      POSTGRES_PASSWORD: crew
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crew -d crew_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: crew-minio
      MINIO_ROOT_PASSWORD: crew-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 crew-minio crew-minio-secret &&
      mc mb --ignore-existing local/crew-management-assets &&
      mc anonymous set download local/crew-management-assets
      "

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://crew:crew@postgres:5432/crew_management
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      PORT: 4000
      OBJECT_STORE_BUCKET: crew-management-assets
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: crew-minio
      OBJECT_STORE_SECRET_KEY: crew-minio-secret
      QR_TRANSFER_SECRET: dev-qr-secret-change-me
      GEOFENCE_DEFAULT_RADIUS_M: 75
    ports:
      - "4000:4000"

volumes:
  postgres_data:
  minio_data:
